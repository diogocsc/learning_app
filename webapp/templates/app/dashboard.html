{% extends "layout.html" %}
{% block content %}
  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5 mb-3">Subjects</h2>
          <form method="post" action="{{ url_for('app.subjects_select') }}" class="mb-3">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="form-label">Current subject</label>
            <select class="form-select" name="subject_id" onchange="this.form.submit()">
              <option value="">(Select subject)</option>
              {% for sid, name in subjects %}
                <option value="{{ sid }}" {% if current_subject_id==sid %}selected{% endif %}>{{ name }}</option>
              {% endfor %}
            </select>
          </form>

          {% if current_subject_id %}
            <form method="post" action="{{ url_for('app.subjects_delete') }}" class="mb-3"
                  onsubmit="return confirm('Delete this subject and ALL its cards, attempts, and uploaded files?')">
              <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
              <input type="hidden" name="subject_id" value="{{ current_subject_id }}">
              <button class="btn btn-outline-danger w-100" type="submit">Delete selected subject</button>
            </form>
          {% endif %}

          <form method="post" action="{{ url_for('app.subjects_create') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label class="form-label">Create new subject</label>
            <div class="input-group">
              <input class="form-control" name="name" placeholder="e.g. Data Structures" required>
              <button class="btn btn-outline-primary" type="submit">Add</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-2">Welcome</h1>
          <p class="text-muted mb-0">Pick a subject to upload PDFs, generate cards, and start studying.</p>
          <div class="mt-3 d-flex gap-2">
            <a class="btn btn-primary" href="{{ url_for('app.subject') }}">Go to subject</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('app.study') }}">Study</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('app.quiz') }}">Quiz</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('app.progress') }}">Progress</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('app.companion') }}">Companion</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
