{% extends "layout.html" %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Create account</h1>
          <form method="post" action="{{ url_for('auth.register_post') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input class="form-control" name="username" autocomplete="username" required>
            </div>
            <div class="row g-2">
              <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" name="password" type="password" autocomplete="new-password" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Confirm password</label>
                <input class="form-control" name="password2" type="password" autocomplete="new-password" required>
              </div>
            </div>

            <div class="mt-2 p-3 rounded border bg-light">
              <div class="fw-semibold mb-2">Human verification</div>
              <div class="small text-muted mb-2">Click the <strong>{{ captcha_target_label }}</strong> emoji:</div>
              <div class="d-flex gap-2 flex-wrap">
                {% for e in captcha_choices %}
                  <label class="btn btn-outline-secondary">
                    <input class="form-check-input me-1" type="radio" name="captcha_selected" value="{{ e }}" required>
                    <span class="fs-5">{{ e }}</span>
                  </label>
                {% endfor %}
              </div>
            </div>

            <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
          </form>

          <div class="mt-3 small">
            Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
